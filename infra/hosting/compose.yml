name: codeless-publication
services:
  hosting:
    image: nginx:1.27.5-alpine
    user: "101:101"
    restart: unless-stopped
    ports:
      - "${CODELESS_PUBLIC_BIND:?required}:8443"
    volumes:
      - ${CODELESS_HOSTING_CONFIG:?required}:/etc/nginx/conf.d/default.conf:ro
      - ${CODELESS_HOSTING_ROOT:?required}:/sites:ro
      - ${CODELESS_TLS_CERT:?required}:/certs/server.pem:ro
      - ${CODELESS_TLS_KEY:?required}:/certs/server.key:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
