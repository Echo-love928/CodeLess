name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  static:
    name: verify:static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static

  api:
    name: verify:api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm verify:api

  runner:
    name: verify:runner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prepare locked Chromium
        timeout-minutes: 5
        run: node .github/scripts/prepare-chromium.mjs
      - run: pnpm verify:runner
      - name: Verify Linux worker ownership and cancellation
        run: python3 tests/infra/public-worker.test.py

  infra:
    name: infra-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Check Docker, PostgreSQL and isolated services
        run: bash infra/ci-preflight.sh .env.example

  e2e:
    name: verify:e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prepare locked Chromium
        timeout-minutes: 5
        run: node .github/scripts/prepare-chromium.mjs
      - name: Run browser smoke
        run: pnpm verify:e2e
        env:
          DEBUG: pw:browser,pw:worker
      - name: Retain failed hosting fixture network evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-network-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local-data/d15-b/hosting/chromium-netlog.json
            .local-data/d15-b/hosting/chromium-network-failure.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: ci-gate
    if: always()
    needs: [static, api, runner, e2e, infra]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, cancelled, skipped, or unknown checks
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          API_RESULT: ${{ needs.api.result }}
          RUNNER_RESULT: ${{ needs.runner.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
        run: |
          for result in "$STATIC_RESULT" "$API_RESULT" "$RUNNER_RESULT" "$E2E_RESULT" "$INFRA_RESULT"; do
            test "$result" = success || exit 1
          done
