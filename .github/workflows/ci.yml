name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  static:
    name: verify:static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static

  api:
    name: verify:api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm verify:api

  runner:
    name: verify:runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:runner

  infra:
    name: infra-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Check Docker, PostgreSQL and isolated services
        run: bash infra/ci-preflight.sh .env.example

  e2e:
    name: verify:e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        timeout-minutes: 3
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke
        run: pnpm verify:e2e
        env:
          DEBUG: pw:browser,pw:worker

  ci-gate:
    name: ci-gate
    if: always()
    needs: [static, api, runner, e2e, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled, skipped, or unknown checks
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          API_RESULT: ${{ needs.api.result }}
          RUNNER_RESULT: ${{ needs.runner.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
        run: |
          for result in "$STATIC_RESULT" "$API_RESULT" "$RUNNER_RESULT" "$E2E_RESULT" "$INFRA_RESULT"; do
            test "$result" = success || exit 1
          done
