name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  static:
    name: verify:static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static

  api:
    name: verify:api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm verify:api

  runner:
    name: verify:runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:runner

  e2e:
    name: verify:e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODELESS_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version
      - run: pnpm verify:e2e

  ci-gate:
    name: ci-gate
    if: always()
    needs: [static, api, runner, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled, skipped, or unknown checks
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          API_RESULT: ${{ needs.api.result }}
          RUNNER_RESULT: ${{ needs.runner.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          for result in "$STATIC_RESULT" "$API_RESULT" "$RUNNER_RESULT" "$E2E_RESULT"; do
            test "$result" = success || exit 1
          done
