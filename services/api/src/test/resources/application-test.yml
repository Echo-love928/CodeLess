spring:
  datasource:
    url: ${CODELESS_TEST_DATABASE_URL}
    username: ${CODELESS_TEST_DATABASE_USER}
    password: ${CODELESS_TEST_DATABASE_PASSWORD}
codeless:
  capacity:
    # The integration suite reuses demo users for hundreds of unrelated scenarios.
    # Quota-specific tests construct their own bounded policy and isolated owners.
    user-daily-tasks: 10000
  deploy:
    worker-enabled: false
  model:
    provider: deterministic-mock
  tasks:
    enabled: false
  recovery:
    sweep-enabled: false
