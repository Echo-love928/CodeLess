spring:
  application:
    name: codeless-api
  datasource:
    url: ${CODELESS_DATABASE_URL}
    username: ${CODELESS_DATABASE_USER}
    password: ${CODELESS_DATABASE_PASSWORD}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non-null
server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${CODELESS_COOKIE_SECURE:true}
        same-site: lax
codeless:
  model:
    provider: ${CODELESS_MODEL_PROVIDER:deterministic-mock}
    audit-root: ${CODELESS_MODEL_AUDIT_ROOT:.local-data/model-calls}
